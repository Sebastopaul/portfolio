<section class="timeline-section">
  <h2>Mon parcours</h2>

  <mat-button-toggle-group
    [(ngModel)]="filter"
    aria-label="Filtrer par type"
    color="primary"
    class="filter-toggle-group"
  >
    <mat-button-toggle value="all">Tout</mat-button-toggle>
    <mat-button-toggle value="formation">Formations</mat-button-toggle>
    <mat-button-toggle value="experience">Expériences</mat-button-toggle>
  </mat-button-toggle-group>

  <div class="timeline-container">
    @for (item of filteredItems; track item.id) {
      item
    } @empty {
      <p class="empty-state">Aucun élément trouvé.</p>
    }
  </div>
</section>
